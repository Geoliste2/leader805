name: Supabase keep-alive

on:
  schedule:
    - cron: '0 6 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPA_URL: https://bpboyrmgluzvdowhfvoj.supabase.co
          SUPA_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$SUPA_URL/rest/v1/trips?select=id&limit=1" \
            -H "apikey: $SUPA_KEY" \
            -H "Authorization: Bearer $SUPA_KEY")
          echo "Supabase REST responded with HTTP $code"
          if [ "$code" -ge 400 ]; then
            echo "::error::Supabase ping failed with HTTP $code"
            exit 1
          fi
